services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-3001}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3001}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:3001}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_SUPER_ADMIN_USERNAME: ${INITIAL_SUPER_ADMIN_USERNAME:-admin}
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      PUBLIC_KNOWLEDGE_SPACE_NAME: ${PUBLIC_KNOWLEDGE_SPACE_NAME:-Public Knowledge Base}
      FILE_STORAGE_ROOT: /app/data
      ONLYOFFICE_DOCUMENT_SERVER_URL: ${ONLYOFFICE_DOCUMENT_SERVER_URL:-http://localhost:8080}
      ONLYOFFICE_DOCUMENT_SERVER_INTERNAL_URL: ${ONLYOFFICE_DOCUMENT_SERVER_INTERNAL_URL:-http://onlyoffice}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      EDIT_LOCK_MINUTES: ${EDIT_LOCK_MINUTES:-30}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - app-data:/app/data

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:latest}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-true}
    ports:
      - "${ONLYOFFICE_PORT:-8080}:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-db:/var/lib/postgresql

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
  app-data:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-lib:
  onlyoffice-db:
